<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390"><rect width="900" height="390" rx="28" fill="#fff7fa"/><text x="35" y="48" font-family="sans-serif" font-size="25" font-weight="bold" fill="#9f4f76">องค์ประกอบของเลือดที่ตรวจใน CBC</text><g transform="translate(65 100)"><circle cx="120" cy="105" r="83" fill="#f8dce4" stroke="#d96f9c" stroke-width="4"/><g fill="#d96f9c"><circle cx="80" cy="70" r="18"/><circle cx="145" cy="65" r="18"/><circle cx="165" cy="130" r="18"/><circle cx="90" cy="145" r="18"/><circle cx="125" cy="105" r="18"/></g><g fill="#fff" stroke="#bd6d8b" stroke-width="3"><circle cx="245" cy="85" r="28"/><circle cx="245" cy="85" r="12"/><circle cx="300" cy="150" r="28"/><circle cx="300" cy="150" r="12"/></g><g fill="#8a77bd"><circle cx="350" cy="70" r="8"/><circle cx="375" cy="115" r="8"/><circle cx="340" cy="155" r="8"/></g><g font-family="sans-serif" fill="#39414c"><text x="50" y="235" font-size="20">RBC</text><text x="5" y="260" font-size="16">เม็ดเลือดแดง</text><text x="220" y="235" font-size="20">WBC</text><text x="190" y="260" font-size="16">เม็ดเลือดขาว</text><text x="340" y="235" font-size="20">Platelets</text><text x="325" y="260" font-size="16">เกล็ดเลือด</text></g></g><rect x="545" y="100" width="290" height="210" rx="20" fill="#e9f7f1"/><text x="575" y="145" font-family="sans-serif" font-size="22" font-weight="bold" fill="#287e68">CBC ช่วยประเมิน</text><text x="575" y="190" font-family="sans-serif" font-size="19" fill="#39414c">• ภาวะโลหิตจาง</text><text x="575" y="230" font-family="sans-serif" font-size="19" fill="#39414c">• การตอบสนองทางภูมิคุ้มกัน</text><text x="575" y="270" font-family="sans-serif" font-size="19" fill="#39414c">• จำนวนเกล็ดเลือด</text></svg>