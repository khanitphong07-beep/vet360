<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390"><rect width="900" height="390" rx="28" fill="#f4fbf8"/><text x="35" y="48" font-family="sans-serif" font-size="25" font-weight="bold" fill="#287e68">อุปกรณ์พื้นฐานในห้องตรวจ</text><g font-family="sans-serif" text-anchor="middle" fill="#39414c"><g transform="translate(110 95)"><circle cx="80" cy="65" r="28" fill="#dcecf3" stroke="#54879b" stroke-width="8"/><path d="M80 93 V165 Q80 195 115 195" fill="none" stroke="#54879b" stroke-width="9" stroke-linecap="round"/><text x="80" y="235" font-size="20">Stethoscope</text><text x="80" y="260" font-size="16">หูฟังแพทย์</text></g><g transform="translate(340 95)"><rect x="65" y="20" width="35" height="140" rx="17" fill="#fff" stroke="#d96f9c" stroke-width="7"/><rect x="75" y="90" width="15" height="60" fill="#ef9ab9"/><text x="82" y="235" font-size="20">Thermometer</text><text x="82" y="260" font-size="16">เทอร์โมมิเตอร์</text></g><g transform="translate(560 95)"><path d="M55 25 H120 L110 75 L100 155 H75 L65 75Z" fill="#d8eee5" stroke="#399b7c" stroke-width="7"/><path d="M70 85 H105" stroke="#399b7c" stroke-width="5"/><text x="87" y="235" font-size="20">Syringe</text><text x="87" y="260" font-size="16">กระบอกฉีดยา</text></g><g transform="translate(740 95)"><circle cx="65" cy="80" r="48" fill="#fff" stroke="#7d8792" stroke-width="7"/><path d="M65 128 L65 185 M65 150 L25 185 M65 150 L105 185" stroke="#7d8792" stroke-width="8" stroke-linecap="round"/><text x="65" y="235" font-size="20">Microscope</text><text x="65" y="260" font-size="16">กล้องจุลทรรศน์</text></g></g></svg>